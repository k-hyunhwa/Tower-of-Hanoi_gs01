<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관산중학교 하노이의 탑 챌린지</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Noto Sans KR", sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body { touch-action: manipulation; }
    .glow-indigo { box-shadow: 0 0 20px -3px rgba(99, 102, 241, 0.5); }
    .lamp-bar-on {
      box-shadow: 0 0 12px 2px rgba(52, 211, 153, 0.8);
      animation: barPulse 1.8s infinite ease-in-out;
    }
    @keyframes barPulse {
      0%, 100% { opacity: 1; filter: brightness(1.1); }
      50% { opacity: 0.8; filter: brightness(0.9); }
    }
    .peg-drop-target {
      background-color: rgba(99, 102, 241, 0.15) !important;
      border-color: rgba(129, 140, 248, 0.8) !important;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen h-[100dvh] flex flex-col justify-between overflow-x-hidden relative">

  <!-- 로그인 모달 -->
  <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/90 backdrop-blur-xl">
    <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl text-center">
      <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/15 border border-indigo-500/30 text-indigo-300 text-xs font-semibold mb-2">
        관산중학교 수학 탐구 활동
      </div>
      <h2 class="text-xl sm:text-2xl font-black text-white mb-1">하노이의 탑 챌린지</h2>
      <p class="text-xs text-slate-400 mb-6">학생 확인을 위해 학번과 이름을 입력해주세요.</p>

      <form id="studentLoginForm" class="w-full space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">학번 (예: 10325)</label>
          <input type="text" id="studentIdInput" required placeholder="학번을 입력하세요" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-1">이름</label>
          <input type="text" id="studentNameInput" required placeholder="이름을 입력하세요" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-white text-sm outline-none focus:border-indigo-500" />
        </div>
        <div id="loginErrorText" class="text-rose-400 text-xs font-medium hidden"></div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition-all mt-2 cursor-pointer">
          게임 시작하기
        </button>
      </form>
    </div>
  </div>

  <!-- 우측 순위표 슬라이더 -->
  <div id="rankingPanel" class="fixed top-24 right-0 z-40 transition-transform duration-300 translate-x-[230px] flex items-start">
    <button id="toggleRankBtn" type="button" class="bg-slate-900 border-y border-l border-indigo-500/50 text-amber-300 px-2 py-4 rounded-l-2xl shadow-xl flex flex-col items-center gap-1 cursor-pointer">
      <i data-lucide="trophy" class="w-4 h-4"></i>
      <span class="text-[10px] font-black [writing-mode:vertical-lr]">순위표</span>
    </button>
    <div class="w-[230px] bg-slate-900 border-y border-l border-indigo-500/40 rounded-bl-3xl p-3 shadow-2xl">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-slate-800">
        <span id="rankStageTitle" class="text-xs font-bold text-amber-300">3단 순위</span>
        <button id="manualRefreshBtn" type="button" class="text-[10px] text-emerald-400 hover:underline cursor-pointer">새로고침</button>
      </div>
      <ol id="rankList" class="space-y-1.5 text-xs text-slate-300 max-h-56 overflow-y-auto pr-1">
        <li class="text-slate-500 text-center py-2 text-[11px]">순위 불러오는 중...</li>
      </ol>
    </div>
  </div>

  <!-- 상단 컨트롤 헤더 -->
  <header class="relative z-10 w-full max-w-5xl mx-auto px-4 pt-3 flex-shrink-0">
    <div class="flex items-center justify-between gap-2 bg-slate-900/80 border border-slate-800 p-2.5 rounded-2xl">
      <div class="flex items-center gap-2">
        <div id="studentBadge" class="hidden items-center gap-1.5 bg-slate-800 px-2.5 py-1 rounded-xl text-xs">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
          <span id="displayStudentInfo" class="text-white font-semibold"></span>
          <button id="logoutBtn" class="ml-1 text-slate-400 hover:text-rose-400 cursor-pointer text-[10px]">변경</button>
        </div>
        <h1 class="text-sm font-bold text-white">하노이의 탑 챌린지</h1>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="pauseBtn" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-xl text-xs cursor-pointer">일시정지</button>
        <button id="restartBtn" class="px-2.5 py-1 bg-slate-800 text-slate-300 rounded-xl text-xs cursor-pointer">다시시작</button>
      </div>
    </div>

    <!-- 단계 선택 -->
    <div class="mt-2 bg-slate-900/60 border border-slate-800 rounded-2xl p-2">
      <div class="grid grid-cols-5 sm:grid-cols-10 gap-1.5" id="stageButtonsContainer"></div>
    </div>
  </header>

  <!-- 대시보드 상태 패널 -->
  <section class="relative z-10 w-full max-w-5xl mx-auto px-4 py-2 flex-shrink-0">
    <div class="grid grid-cols-3 gap-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-2.5 text-center">
      <div>
        <span class="text-[10px] text-slate-400">현재 단계 / 최소 이동</span>
        <div class="text-sm font-black text-indigo-400 mt-0.5">
          <span id="currentStageText">3단</span> / <span id="minMovesText">7</span>회
        </div>
      </div>
      <div class="border-x border-slate-800">
        <span class="text-[10px] text-slate-400">내 이동 횟수</span>
        <div class="text-lg font-black text-white" id="moveCountText">0</div>
      </div>
      <div>
        <span class="text-[10px] text-slate-400">남은 시간</span>
        <div class="text-sm font-extrabold text-amber-300 font-mono" id="timeRemainingText">00:50</div>
      </div>
    </div>
  </section>

  <!-- 메인 보드 -->
  <main class="relative z-10 w-full max-w-5xl mx-auto px-4 flex-1 flex flex-col justify-center my-auto min-h-[260px]">
    <div class="relative w-full h-[260px] sm:h-[320px] bg-slate-900/60 border border-slate-800 rounded-3xl p-4 flex items-end justify-around gap-2" id="gameBoardContainer">
      <!-- 기둥 0, 1, 2 -->
      <div class="peg-container flex-1 h-full flex flex-col items-center justify-end relative cursor-pointer" data-peg-index="0">
        <div class="absolute bottom-6 w-3 bg-slate-600 rounded-t-full" style="height: 80%;"></div>
        <div id="diskStack-0" class="w-full flex-1 flex flex-col justify-end items-center z-10 pb-0"></div>
        <div class="w-full h-6 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-indigo-300">A 출발</div>
      </div>
      <div class="peg-container flex-1 h-full flex flex-col items-center justify-end relative cursor-pointer" data-peg-index="1">
        <div class="absolute bottom-6 w-3 bg-slate-600 rounded-t-full" style="height: 80%;"></div>
        <div id="diskStack-1" class="w-full flex-1 flex flex-col justify-end items-center z-10 pb-0"></div>
        <div class="w-full h-6 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-indigo-300">B 경유</div>
      </div>
      <div class="peg-container flex-1 h-full flex flex-col items-center justify-end relative cursor-pointer" data-peg-index="2">
        <div class="absolute bottom-6 w-3 bg-slate-600 rounded-t-full" style="height: 80%;"></div>
        <div id="diskStack-2" class="w-full flex-1 flex flex-col justify-end items-center z-10 pb-0"></div>
        <div class="w-full h-6 bg-slate-800 border border-slate-700 rounded-xl flex items-center justify-center text-xs font-bold text-emerald-400">C 목표</div>
      </div>
    </div>
  </main>

  <footer class="relative z-10 w-full text-center py-2 text-[10px] text-slate-500">
    관산중학교 수학 탐구 교실
  </footer>

  <script>
    const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbyQx110daWPqOEBfkwh31diRBQ4hSX1OIPwCzww6FMTqSgSWZf3QQC32wcShUuK0MSF-w/exec";
    const STAGE_LIMITS = { 3: 50, 4: 90, 5: 180, 6: 360, 7: 750, 8: 1500, 9: 3000, 10: 6000, 11: 12000, 12: 24000 };
    const DISK_COLORS = ['bg-rose-500', 'bg-amber-500', 'bg-emerald-500', 'bg-teal-500', 'bg-sky-500', 'bg-indigo-500', 'bg-purple-500', 'bg-pink-500', 'bg-red-600', 'bg-cyan-600', 'bg-violet-600', 'bg-fuchsia-600'];

    let currentStage = 3;
    let pegs = [[], [], []];
    let selectedPeg = null;
    let moves = 0;
    let timeRemaining = 50;
    let timer = null;
    let currentStudent = null;
    let isRankOpen = false;

    window.onload = function() {
      // 1. 학생 로그인 점검
      const saved = localStorage.getItem("hanoi_student");
      if (saved) {
        currentStudent = JSON.parse(saved);
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('studentBadge').classList.remove('hidden');
        document.getElementById('studentBadge').classList.add('flex');
        document.getElementById('displayStudentInfo').innerText = `${currentStudent.id} ${currentStudent.name}`;
      }

      document.getElementById('studentLoginForm').onsubmit = function(e) {
        e.preventDefault();
        const id = document.getElementById('studentIdInput').value.trim();
        const name = document.getElementById('studentNameInput').value.trim();
        if (id && name) {
          currentStudent = { id, name };
          localStorage.setItem("hanoi_student", JSON.stringify(currentStudent));
          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('studentBadge').classList.remove('hidden');
          document.getElementById('studentBadge').classList.add('flex');
          document.getElementById('displayStudentInfo').innerText = `${id} ${name}`;
        }
      };

      document.getElementById('logoutBtn').onclick = function() {
        localStorage.removeItem("hanoi_student");
        currentStudent = null;
        document.getElementById('loginScreen').classList.remove('hidden');
      };

      // 2. 순위표 토글
      const rankPanel = document.getElementById('rankingPanel');
      document.getElementById('toggleRankBtn').onclick = function() {
        isRankOpen = !isRankOpen;
        rankPanel.classList.toggle('translate-x-[230px]', !isRankOpen);
      };
      document.getElementById('manualRefreshBtn').onclick = () => fetchRanking(currentStage);

      // 3. 기둥 클릭 이벤트 바인딩
      document.querySelectorAll('.peg-container').forEach(el => {
        el.onclick = () => onPegClick(parseInt(el.dataset.pegIndex));
      });

      document.getElementById('restartBtn').onclick = initGame;
      
      lucide.createIcons();
      initGame();
    };

    function initGame() {
      clearInterval(timer);
      pegs = [[], [], []];
      for (let i = currentStage; i >= 1; i--) pegs[0].push(i);
      selectedPeg = null;
      moves = 0;
      timeRemaining = STAGE_LIMITS[currentStage] || 60;

      updateUI();
      renderDisks();
      renderStageButtons();
      startTimer();
      fetchRanking(currentStage);
    }

    function startTimer() {
      timer = setInterval(() => {
        timeRemaining--;
        const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
        const s = String(timeRemaining % 60).padStart(2, '0');
        document.getElementById('timeRemainingText').innerText = `${m}:${s}`;
        if (timeRemaining <= 0) {
          clearInterval(timer);
          alert("시간이 초과되었습니다! 다시 시도하세요.");
          initGame();
        }
      }, 1000);
    }

    function updateUI() {
      document.getElementById('currentStageText').innerText = `${currentStage}단`;
      document.getElementById('minMovesText').innerText = Math.pow(2, currentStage) - 1;
      document.getElementById('moveCountText').innerText = moves;
    }

    function renderStageButtons() {
      const container = document.getElementById('stageButtonsContainer');
      container.innerHTML = '';
      for (let s = 3; s <= 12; s++) {
        const btn = document.createElement('button');
        btn.className = `py-1 rounded-lg text-xs font-bold cursor-pointer ${s === currentStage ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`;
        btn.innerText = `${s}단`;
        btn.onclick = () => { currentStage = s; initGame(); };
        container.appendChild(btn);
      }
    }

    function renderDisks() {
      for (let p = 0; p < 3; p++) {
        const stack = document.getElementById(`diskStack-${p}`);
        stack.innerHTML = '';
        for (let idx = pegs[p].length - 1; idx >= 0; idx--) {
          const size = pegs[p][idx];
          const isSelected = (selectedPeg === p && idx === pegs[p].length - 1);
          const disk = document.createElement('div');
          const widthPct = 25 + ((size - 1) / Math.max(1, currentStage - 1)) * 70;
          disk.className = `rounded-lg my-0.5 text-center text-white text-[10px] font-bold py-0.5 transition-transform ${DISK_COLORS[(size - 1) % DISK_COLORS.length]} ${isSelected ? '-translate-y-2 ring-2 ring-white' : ''}`;
          disk.style.width = `${widthPct}%`;
          disk.innerText = size;
          stack.appendChild(disk);
        }
      }
    }

    function onPegClick(p) {
      if (selectedPeg === null) {
        if (pegs[p].length === 0) return;
        selectedPeg = p;
        renderDisks();
      } else {
        if (selectedPeg === p) {
          selectedPeg = null;
          renderDisks();
          return;
        }
        const disk = pegs[selectedPeg][pegs[selectedPeg].length - 1];
        const targetTop = pegs[p][pegs[p].length - 1];
        if (targetTop !== undefined && targetTop < disk) {
          alert("더 큰 원판을 작은 원판 위에 올릴 수 없습니다!");
          selectedPeg = null;
          renderDisks();
          return;
        }
        pegs[selectedPeg].pop();
        pegs[p].push(disk);
        moves++;
        selectedPeg = null;
        updateUI();
        renderDisks();

        if (pegs[2].length === currentStage) {
          clearInterval(timer);
          confetti({ particleCount: 70, spread: 60 });
          alert(`성공! ${moves}회 만에 클리어했습니다.`);
          submitScore(currentStage, moves, timeRemaining);
        }
      }
    }

    function submitScore(stage, moves, timeLeft) {
      if (!currentStudent || !GOOGLE_APP_URL.startsWith("http")) return;
      fetch(GOOGLE_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          stage: stage,
          studentId: currentStudent.id,
          name: currentStudent.name,
          moves: moves,
          timeLeft: timeLeft
        })
      }).then(() => setTimeout(() => fetchRanking(stage), 1200));
    }

    function fetchRanking(stage) {
      if (!GOOGLE_APP_URL.startsWith("http")) return;
      document.getElementById('rankStageTitle').innerText = `${stage}단 순위`;
      fetch(`${GOOGLE_APP_URL}?stage=${stage}`)
        .then(res => res.json())
        .then(data => {
          const list = document.getElementById('rankList');
          list.innerHTML = '';
          if (!data || data.length === 0) {
            list.innerHTML = '<li class="text-slate-500 text-center py-2 text-[11px]">성공 기록이 없습니다.</li>';
            return;
          }
          data.forEach((r, idx) => {
            const li = document.createElement('li');
            li.className = 'flex justify-between bg-slate-800/80 px-2 py-1 rounded text-[11px]';
            li.innerHTML = `<span>${idx + 1}위 ${r.name}</span><span class="text-indigo-300 font-bold">${r.moves}회</span>`;
            list.appendChild(li);
          });
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
